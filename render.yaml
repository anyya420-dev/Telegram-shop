databases:
  - name: narcos-shop-db2.0
    plan: free

services:
  # Backend Web Service
  - type: web
    name: telegram-shop-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: narcos-shop-db2.0
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: ALLOW_DEMO_MODE
        value: "false"
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOT_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false

  # Frontend Static Site
  - type: web
    runtime: static
    name: telegram-shop-frontend
    buildCommand: npm install && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
