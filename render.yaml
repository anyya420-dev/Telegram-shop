databases:
  - name: narcos-shop-db2.0
    plan: free

services:
  # Backend Web Service (Render URL: https://narcos-shop.onrender.com)
  - type: web
    name: Narcos-shop
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install --include=dev && npm run build --workspace backend
    # Recovery path for the one-time P3009 failure of 20260825140000_add_admin_server_sessions.
    # If migrate deploy succeeds (normal case), the fallback never runs.
    # If migrate deploy fails, the fallback resolves that specific migration as rolled-back
    # (safe because its SQL uses IF NOT EXISTS) and retries deploy.
    # If a *different* migration fails, resolve --rolled-back will error because the target
    # migration is already applied; the && chain aborts and deploy fails visibly as expected.
    # Once this migration is confirmed applied in production, simplify to:
    #   npm run db:generate --workspace backend && npm run db:migrate:deploy --workspace backend
    preDeployCommand: npm run db:generate --workspace backend && (cd backend && npx prisma migrate deploy --schema ./prisma/schema.prisma || (npx prisma migrate resolve --rolled-back 20260825140000_add_admin_server_sessions --schema ./prisma/schema.prisma && npx prisma migrate deploy --schema ./prisma/schema.prisma))
    startCommand: npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: narcos-shop-db2.0
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://telegram-shop-3781.onrender.com
      - key: WEB_APP_URL
        value: https://telegram-shop-3781.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOW_DEMO_MODE
        value: "false"

  # Frontend Static Site (Render URL: https://telegram-shop-3781.onrender.com)
  - type: web
    runtime: static
    name: Telegram-shop
    buildCommand: npm install && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://narcos-shop.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Bot Worker (optional — only starts if TELEGRAM_BOT_TOKEN is set)
  - type: worker
    name: telegram-shop-bot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace bot
    startCommand: npm run start --workspace bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        # Set to your frontend static site URL
        sync: false
