databases:
  - name: telegram-shop-db
    plan: free

services:
  # Backend Web Service (Telegram Shop API)
  - type: web
    name: telegram-shop-backend
    runtime: node
    plan: starter
    healthCheckPath: /health
    buildCommand: npm install --include=dev && npm run build --workspace backend
    preDeployCommand: npm run db:generate --workspace backend && npm run db:migrate:deploy --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-shop-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://telegram-shop-frontend-w1zw.onrender.com
      - key: WEB_APP_URL
        value: https://telegram-shop-frontend-w1zw.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://telegram-shop-frontend-w1zw.onrender.com
      - key: ALLOW_DEMO_MODE
        value: "false"

  # Frontend Static Site (Render URL: https://telegram-shop-frontend-w1zw.onrender.com)
  - type: web
    runtime: static
    name: telegram-shop-frontend
    buildCommand: npm install && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://telegram-shop-backend-zfer.onrender.com/api
    routes:
      - type: redirect
        source: /admin
        destination: /#/admin
      - type: rewrite
        source: /*
        destination: /index.html

  # Bot Worker (optional — only starts if TELEGRAM_BOT_TOKEN is set)
  - type: worker
    name: telegram-shop-bot
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build --workspace bot
    startCommand: npm run start --workspace bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://telegram-shop-frontend-w1zw.onrender.com
