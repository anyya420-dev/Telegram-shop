databases:
  - name: narcos-shop-db2.0
    plan: free

services:
  # Backend Web Service
  - type: web
    name: telegram-shop-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: narcos-shop-db2.0
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        # Set to your Render static site URL, e.g. https://telegram-shop-frontend.onrender.com
        sync: false
      - key: ALLOW_DEMO_MODE
        value: "false"

  # Frontend Static Site
  - type: web
    runtime: static
    name: telegram-shop-frontend
    buildCommand: npm install && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        # Set to your backend URL, e.g. https://telegram-shop-backend.onrender.com/api
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Bot Worker (optional — only starts if TELEGRAM_BOT_TOKEN is set)
  - type: worker
    name: telegram-shop-bot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace bot
    startCommand: npm run start --workspace bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        # Set to your frontend static site URL
        sync: false
